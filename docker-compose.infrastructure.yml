services:
  postgres:
    image: postgres:16-alpine
    container_name: tuling-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: langgraph_agents
    ports:
      - "5432:5432"
    volumes:
      - tuling_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langgraph_agents"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tuling_ai_postgres_data:
